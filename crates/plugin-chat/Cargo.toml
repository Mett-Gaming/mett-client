[package]
name = "plugin-chat"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "chat"
crate-type = ["cdylib"]

[dependencies]
mett-plugin = { path = "../mett-plugin" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
