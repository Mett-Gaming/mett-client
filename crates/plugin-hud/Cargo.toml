[package]
name = "plugin-hud"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "mett_hud"
crate-type = ["cdylib"]

[dependencies]
hud = { path = "../hud" }
hudlink = { path = "../hudlink" }
mett-plugin = { path = "../mett-plugin" }
render = { path = "../render" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
mett-inject = { path = "../mett-inject" }
