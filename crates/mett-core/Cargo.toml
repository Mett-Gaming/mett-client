[package]
name = "mett-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "mett_core"
crate-type = ["cdylib"]

[dependencies]
mett-plugin = { path = "../mett-plugin" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading"] }
