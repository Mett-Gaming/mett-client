[package]
name = "mett-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "MettClient"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
hud = { path = "../hud" }
hudlink = { path = "../hudlink" }
config = { path = "../config" }
sources = { path = "../sources" }
gamemem = { path = "../gamemem" }
compat = { path = "../compat" }
mett-inject = { path = "../mett-inject" }
mett-plugin = { path = "../mett-plugin" }
render = { path = "../render" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
